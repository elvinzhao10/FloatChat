name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift test
      - run: make app
        env:
          CODESIGN_IDENTITY: "-"
      - run: codesign --verify --strict --deep build/FloatChat.app
